name: Analysis

on: push

jobs:
  analysis:
    if: false # disable for now
    name: PHPStan (larastan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ldap, gd, pdo_mysql, zip, mbstring, intl, bcmath, curl
          coverage: none

      - name: Prepare the environment
        # larastan boots the application, which needs an APP_KEY and valid config.
        run: cp .env.testing .env

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Setup composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install --no-ansi --no-interaction --no-scripts --prefer-dist --no-progress

      - name: Run PHPStan
        run: ./vendor/bin/phpstan --error-format=github --memory-limit=1G
