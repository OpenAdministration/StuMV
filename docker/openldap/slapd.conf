# Development / CI slapd.conf for StuMV
#
# Mirrors the production Symas OpenLDAP configuration (dynlist-synthesised
# memberOf, argon2 password module, ppolicy module, group-based ACLs) with
# prod-specific paths, TLS and secrets stripped for a self-contained container.
# Ported from a sanitised `slapcat -n0` dump of production.
#
# slapd is started directly from this file (`slapd -f`) rather than a slapd.d
# directory: the config *content* is what needs to match prod, not the storage
# format, and this keeps the setup readable and reviewable.

include		/opt/symas/etc/openldap/schema/core.schema
include		/opt/symas/etc/openldap/schema/cosine.schema
include		/opt/symas/etc/openldap/schema/nis.schema
include		/opt/symas/etc/openldap/schema/inetorgperson.schema
include		/opt/symas/etc/openldap/schema/dyngroup.schema

pidfile		/opt/symas/var/run/slapd.pid
argsfile	/opt/symas/var/run/slapd.args

# In the Symas image the backends and overlays are loadable modules.
modulepath	/opt/symas/lib/openldap
moduleload	back_mdb.la
moduleload	ppolicy.la
moduleload	argon2.la
moduleload	dynlist.la

# Hash new cleartext passwords with argon2 (matches production). Note: prod
# configures no ppolicy overlay, so this only affects the Password Modify exop;
# the application hashes passwords client-side via LdapRecord.
password-hash	{ARGON2}

#######################################################################
# config database (cn=config)
#######################################################################
database	config
rootdn		"cn=config"
rootpw		config-not-production
access to *	by * none

#######################################################################
# main mdb database
#######################################################################
database	mdb
suffix		"dc=stumv,dc=de"
rootdn		"cn=Administration,dc=stumv,dc=de"
rootpw		admin-not-production
directory	/opt/symas/var/openldap-data
maxsize		1073741824
index		objectClass	eq

# dynlist overlay: synthesises the memberOf attribute from uniqueMember, exactly
# as in production. The app's AddMemberOfAttributeScope depends on this.
overlay		dynlist
dynlist-attrset	groupOfURLs memberURL uniqueMember+memberOf@groupOfUniqueNames

# ---- ACLs (ported from prod, dc=stumv variant) --------------------------
# Anonymous may authenticate against the service accounts.
access to dn.one="ou=Services,dc=stumv,dc=de"
	by anonymous auth

# userPassword under ou=People: writable by the write group and by self,
# authenticatable by anonymous, invisible otherwise.
access to dn.one="ou=People,dc=stumv,dc=de" attrs=userPassword
	by group/groupOfUniqueNames/uniqueMember="cn=write,ou=Permissions,ou=Services,dc=stumv,dc=de" write
	by self write
	by anonymous auth
	by * none

# ou=People container + its subtree.
access to dn.exact="ou=People,dc=stumv,dc=de"
	by group/groupOfUniqueNames/uniqueMember="cn=write,ou=Permissions,ou=Services,dc=stumv,dc=de" write
	by users read
access to dn.sub="ou=People,dc=stumv,dc=de"
	by group/groupOfUniqueNames/uniqueMember="cn=write,ou=Permissions,ou=Services,dc=stumv,dc=de" write
	by group/groupOfUniqueNames/uniqueMember="cn=read,ou=Permissions,ou=Services,dc=stumv,dc=de" read
	by anonymous none

# super-admins group.
access to dn.exact="cn=super-admins,dc=stumv,dc=de"
	by group/groupOfUniqueNames/uniqueMember="cn=write,ou=Permissions,ou=Services,dc=stumv,dc=de" write
	by group/groupOfUniqueNames/uniqueMember="cn=read,ou=Permissions,ou=Services,dc=stumv,dc=de" read

# ou=Communities container + its subtree.
access to dn.exact="ou=Communities,dc=stumv,dc=de"
	by group/groupOfUniqueNames/uniqueMember="cn=write,ou=Permissions,ou=Services,dc=stumv,dc=de" write
	by users read
access to dn.sub="ou=Communities,dc=stumv,dc=de"
	by group/groupOfUniqueNames/uniqueMember="cn=write,ou=Permissions,ou=Services,dc=stumv,dc=de" write
	by group/groupOfUniqueNames/uniqueMember="cn=read,ou=Permissions,ou=Services,dc=stumv,dc=de" read
	by anonymous none

# Base entry readable by any authenticated user.
access to dn.exact="dc=stumv,dc=de"
	by users read

# Everything else (incl. the Permissions groups themselves) readable by
# authenticated users so ACL group checks resolve.
access to *
	by users read
	by anonymous none
